steps:
  # Stage 1: Static Code Quality & Security Linting
  - name: 'python:3.11-slim'
    id: 'lint-and-format'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --no-cache-dir flake8
        flake8 src/ --max-line-length=120 --ignore=E501,W503 || true

  # Stage 2: Automated Unit & Security Test Suites
  - name: 'python:3.11-slim'
    id: 'unit-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --no-cache-dir pydantic pydantic-settings
        python -m unittest discover -s tests/unit -v
        python -m unittest discover -s tests/chaos -v

  # Stage 3: Automated Golden Benchmark Evaluation & Quality Gate
  - name: 'python:3.11-slim'
    id: 'eval-benchmark-gate'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        python src/evaluation/eval_pipeline.py

  # Stage 4: Production Container Build & Tagging
  - name: 'gcr.io/cloud-builders/docker'
    id: 'docker-build'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/ms-adc/api-gateway:$SHORT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/ms-adc/api-gateway:latest'
      - '.'

# Concrete GCS Checkpoint & Metrics Artifact Push
artifacts:
  objects:
    location: 'gs://${_GCS_MODEL_BUCKET}/models/${_MODEL_VERSION}/'
    paths:
      - 'models/die_vfm_head.pt'
      - 'models/die_vfm_fp16.engine'
      - 'models/metrics.json'
      - 'models/training_loss_curve.png'

# Substitution Variables
substitutions:
  _GCS_MODEL_BUCKET: 'semicon-metrology-few-shot-seeds'
  _MODEL_VERSION: 'v1.0.0'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/ms-adc/api-gateway:$SHORT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/ms-adc/api-gateway:latest'

timeout: '600s'
